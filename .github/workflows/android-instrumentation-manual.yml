name: Android isolated instrumentation (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  isolated-instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install exact emulator image
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "emulator" "platforms;android-36" "build-tools;36.0.0" \
            "system-images;android-36;google_apis;x86_64"
      - name: Verify ephemeral hardware acceleration
        run: |
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check
      - name: Run isolated instrumentation
        run: |
          mkdir -p TestResults/android
          node Scripts/run-isolated-instrumentation.mjs --image 'system-images;android-36;google_apis;x86_64' --execute 2>&1 | tee TestResults/android/runner.log
      - name: Upload isolated reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-isolated-instrumentation
          path: TestResults/android/
          if-no-files-found: warn
          retention-days: 7
