name: Android SDK
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secret-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks
      - name: Scan complete candidate history
        run: |
          "${RUNNER_TEMP}/gitleaks" git . --no-banner --redact

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DAYKEEPER_CANDIDATE_VERSION: 0.1.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install compile platform
        run: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify contract snapshot
        run: echo 'b62dd386a87380f3fe94f968ff8fedf703ca6079199ea74057d32e31f91e1fec  openapi/customer.yaml' | sha256sum --check
      - name: Tests, lint, R8 example, instrumentation compilation and local packaging
        run: ./gradlew :daykeeper:testDebugUnitTest :daykeeper-ui:testDebugUnitTest lint :example:assembleRelease :example:assembleDebugAndroidTest publishAllPublicationsToVerificationRepository -PdaykeeperVersion="$DAYKEEPER_CANDIDATE_VERSION" --no-daemon --console=plain
      - name: Exact Maven candidate
        run: bash Scripts/check-maven-candidate.sh "$DAYKEEPER_CANDIDATE_VERSION"
      - name: Independent Maven consumer
        run: |
          daykeeper_core_sha=$(sha256sum daykeeper/build/outputs/aar/daykeeper-release.aar | cut -d' ' -f1)
          daykeeper_ui_sha=$(sha256sum daykeeper-ui/build/outputs/aar/daykeeper-ui-release.aar | cut -d' ' -f1)
          ./gradlew -p verification/consumer -PdaykeeperRepository="$GITHUB_WORKSPACE/build/repository" \
            -PdaykeeperVersion="$DAYKEEPER_CANDIDATE_VERSION" \
            -PdaykeeperExpectedCoreSha256="$daykeeper_core_sha" -PdaykeeperExpectedUiSha256="$daykeeper_ui_sha" \
            verifyDaykeeperArtifacts testDebugUnitTest assembleRelease --refresh-dependencies --no-daemon --console=plain
      # No automatic device selection, Maven Central publication or production access.
